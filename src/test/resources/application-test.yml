spring:
  datasource:
    url: jdbc:h2:mem:magictickets_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
